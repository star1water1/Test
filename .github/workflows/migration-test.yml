name: Migration test (emulator)

# **마이그레이션을 실제 Room으로 밟는 유일한 자리** (B-9 ③).
#
# 왜 별도 워크플로인가 — 셋이다.
#   ① **비용이 다르다.** 에뮬레이터 부팅 + 계측 시험은 APK 빌드보다 몇 배 느리다.
#      `build-apk.yml`에 얹으면 모든 PR이 그만큼 느려진다(사용자 승인은 *러너 비용을
#      감수한다*이지 *모든 PR을 느리게 한다*가 아니다 — 확정 14장 1번).
#   ② **실패의 뜻이 다르다.** 이쪽이 빨간불이면 *"DB가 안 열린다"*이고, 그것은
#      컴파일 실패와 처방이 아예 다르다. 한 워크플로에 섞으면 배지 하나로 뭉개진다.
#   ③ **도는 조건이 다르다.** DB를 안 건드린 PR에서는 밟을 것이 없다.
#
# 트리거를 좁게 잡은 것도 같은 이유다 — **DB·스키마·이 시험이 바뀐 PR에서만** 돈다.
# 그 밖에는 수동(`workflow_dispatch`)으로 돌린다.
#
# ⚠️ **스키마 JSON이 커밋되기 전에는 이 워크플로가 할 일이 없다.**
#    `app/schemas/**`가 트리거에 들어 있는 것이 그 뜻이기도 하다 — 첫 커밋이 이것을 깨운다.
#    (`build-apk.yml`의 `Upload Room schemas`가 그 커밋의 재료를 만든다.)
on:
  pull_request:
    branches: [ main, master ]
    paths:
      - 'app/schemas/**'
      - 'app/src/main/java/com/novelcharacter/app/data/database/**'
      - 'app/src/main/java/com/novelcharacter/app/data/model/**'
      - 'app/src/androidTest/**'
      - 'app/build.gradle.kts'
      - '.github/workflows/migration-test.yml'
  workflow_dispatch:

jobs:
  migration:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 스키마가 있는가 — **없으면 빨간불이 아니라 건너뛴다.**
      #
      # 이 판단이 이 워크플로에서 가장 조심스러운 자리다. 위 트리거는 `app/build.gradle.kts`와
      # `app/src/androidTest/**`도 보는데, **B-9 ②(스키마 커밋)가 서기 전에는 그 경로를 건드린
      # PR마다 밟을 것이 없다.** 그때 `exit 1`을 내면 **아무 잘못 없는 PR이 빨간불**이 되고,
      # 이 저장소가 이미 적어 둔 결말로 간다 — *"세울 수 없는 것을 요구하면 그 검사가 늘
      # 빨간불이 되고, 그러면 다음 사람이 검사를 끈다"*(`check_view_probe_targets.sh` 머리).
      #
      # **대신 조용히 넘어가지도 않는다.** `::warning::`으로 PR에 주석을 남기고 요약에도 적는다 —
      # 초록인데 아무것도 안 한 실행을 **아무 말 없이** 두는 것이 이 축에서 가장 나쁜 결말이다.
      #
      # **이 갈래는 한시적이다.** `app/schemas/`가 커밋되는 순간(트리거에 그 경로를 넣은 이유다)
      # 아래 조건이 참이 되어 이 건너뛰기는 다시 밟히지 않는다. 그때 이 문단도 지울 것.
      - name: Room 스키마가 커밋돼 있는가
        id: schemas
        run: |
          set -e
          if [ -d app/schemas ] && [ -n "$(find app/schemas -name '*.json' -print -quit)" ]; then
            COUNT=$(find app/schemas -name '*.json' | wc -l)
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "커밋된 스키마: ${COUNT}개"
            echo "- 커밋된 스키마 **${COUNT}개** — 마이그레이션을 실제 Room으로 밟습니다." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::app/schemas/ 에 커밋된 스키마 JSON이 없어 마이그레이션 시험을 건너뜁니다 (B-9 ②가 남은 걸음)."
            {
              echo "## 마이그레이션 시험을 건너뛰었습니다"
              echo ""
              echo "\`app/schemas/\` 에 커밋된 스키마 JSON이 없습니다 — **밟을 구간이 없습니다.**"
              echo ""
              echo "다음 걸음(B-9 ②): \`build-apk.yml\` 의 \`room-schemas\` 아티팩트를 받아"
              echo "\`app/schemas/\` 에 **그대로** 커밋하세요."
              echo "**손으로 적지 마세요** — \`identityHash\` 가 어긋나면 Room이 DB 열기를 거부합니다."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # KVM 활성화 — 없으면 에뮬레이터가 소프트웨어 렌더링으로 떨어져 몇 배 느려진다.
      - name: Enable KVM
        if: steps.schemas.outputs.present == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # API 26 = 앱의 minSdk. **가장 낮은 지원 버전에서 밟는 것이 요점이다** —
      # 오래 쓴 기기일수록 옛 버전에서 올라오고, 마이그레이션 사슬이 긴 것도 그쪽이다.
      - name: Run migration instrumentation tests
        if: steps.schemas.outputs.present == 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 26
          arch: x86
          target: default
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest --no-daemon

      - name: Upload test reports
        if: always() && steps.schemas.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: migration-test-report
          path: app/build/reports/androidTests/
          retention-days: 14
          if-no-files-found: warn

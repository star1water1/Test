name: Migration test (emulator)

# **마이그레이션을 실제 Room으로 밟는 유일한 자리** (B-9 ③).
#
# 왜 별도 워크플로인가 — 셋이다.
#   ① **비용이 다르다.** 에뮬레이터 부팅 + 계측 시험은 APK 빌드보다 몇 배 느리다.
#      `build-apk.yml`에 얹으면 모든 PR이 그만큼 느려진다(사용자 승인은 *러너 비용을
#      감수한다*이지 *모든 PR을 느리게 한다*가 아니다 — 확정 14장 1번).
#   ② **실패의 뜻이 다르다.** 이쪽이 빨간불이면 *"DB가 안 열린다"*이고, 그것은
#      컴파일 실패와 처방이 아예 다르다. 한 워크플로에 섞으면 배지 하나로 뭉개진다.
#   ③ **도는 조건이 다르다.** DB를 안 건드린 PR에서는 밟을 것이 없다.
#
# 트리거를 좁게 잡은 것도 같은 이유다 — **DB·스키마·이 시험이 바뀐 PR에서만** 돈다.
# 그 밖에는 수동(`workflow_dispatch`)으로 돌린다.
#
# ⚠️ **스키마 JSON이 커밋되기 전에는 이 워크플로가 할 일이 없다.**
#    `app/schemas/**`가 트리거에 들어 있는 것이 그 뜻이기도 하다 — 첫 커밋이 이것을 깨운다.
#    (`build-apk.yml`의 `Upload Room schemas`가 그 커밋의 재료를 만든다.)
on:
  pull_request:
    branches: [ main, master ]
    paths:
      - 'app/schemas/**'
      - 'app/src/main/java/com/novelcharacter/app/data/database/**'
      - 'app/src/main/java/com/novelcharacter/app/data/model/**'
      - 'app/src/androidTest/**'
      - 'app/build.gradle.kts'
      - '.github/workflows/migration-test.yml'
  workflow_dispatch:

jobs:
  migration:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 스키마가 없으면 **여기서 큰소리로 멈춘다.** 시험 안에서도 같은 판정을 하지만,
      # 그쪽은 에뮬레이터를 다 띄운 뒤라 몇 분을 버리고 나서 같은 말을 하게 된다.
      - name: Room 스키마가 커밋돼 있는가
        run: |
          set -e
          if [ ! -d app/schemas ] || [ -z "$(find app/schemas -name '*.json' -print -quit)" ]; then
            echo "::error::app/schemas/ 에 커밋된 스키마 JSON이 없습니다."
            echo "build-apk.yml 의 'Upload Room schemas' 아티팩트를 받아 그대로 커밋할 것."
            echo "손으로 적지 말 것 — identityHash가 어긋나면 Room이 DB 열기를 거부합니다."
            exit 1
          fi
          echo "커밋된 스키마: $(find app/schemas -name '*.json' | wc -l)개"

      # KVM 활성화 — 없으면 에뮬레이터가 소프트웨어 렌더링으로 떨어져 몇 배 느려진다.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # API 26 = 앱의 minSdk. **가장 낮은 지원 버전에서 밟는 것이 요점이다** —
      # 오래 쓴 기기일수록 옛 버전에서 올라오고, 마이그레이션 사슬이 긴 것도 그쪽이다.
      - name: Run migration instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 26
          arch: x86
          target: default
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-test-report
          path: app/build/reports/androidTests/
          retention-days: 14
          if-no-files-found: warn

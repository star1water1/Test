name: Build APK

# 트리거: main/master **에 대한** push, 또는 main/master를 base로 하는 PR.
#   수동 실행도 가능 (workflow_dispatch)
#
#   ⚠️ **작업 브랜치에 push한 것만으로는 돌지 않는다.** 아래 `branches:`가 둘로 한정한다.
#   즉 작업 브랜치의 코드를 CI로 증명하려면 **master를 base로 PR을 열어야 한다.**
#   (2026.08.02 정정 — 종전 주석은 "또는 모든 브랜치에 push 시 빌드"라고 적어 정반대를
#   안내했다. 이 저장소의 여러 문서가 "CI 초록 전까지 완료가 아니다"를 완료 조건으로 걸고
#   있어, 이 한 줄을 믿으면 **돌지도 않은 CI를 기다리거나 통과했다고 착각한다.**)
#
# paths-ignore: **.md 만 바뀐 변경은 빌드를 돌리지 않는다.
#   이 빌드가 증명하는 것은 "코드가 실제로 컴파일되는가"이고(로컬 하네스는 Fragment·ViewModel을
#   컴파일하지 않아 이것이 유일한 검증이다), 문서만 바뀐 diff에는 증명할 것이 없다.
#   **`docs/**`가 아니라 `**.md`로 좁혔다** — docs/ 아래에 스크립트 같은 비문서 파일이 생기면
#   그것은 검사를 받아야 한다.
#   주의: 문서만 바뀐 PR에는 체크가 **하나도 달리지 않는다.** 나중에 브랜치 보호에서
#   'build 통과'를 필수로 걸면 그런 PR이 영영 병합 불가가 되므로, 그때 required 대신
#   'skipped 허용'으로 설정할 것.
on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
  workflow_dispatch:
    inputs:
      build_type:
        description: '빌드 타입'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 단위 테스트 (순수 JVM — 필터/정렬 메모 무효화 회귀 가드). 로컬 SDK 부재로 CI가 유일 검증.
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      # Debug 빌드
      - name: Build Debug APK
        if: github.event.inputs.build_type != 'release'
        run: ./gradlew assembleDebug --no-daemon

      # Release 빌드 (서명 키 있을 때만)
      - name: Build Release APK
        if: github.event.inputs.build_type == 'release'
        run: ./gradlew assembleRelease --no-daemon

      # Debug APK 업로드
      - name: Upload Debug APK
        if: github.event.inputs.build_type != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: NovelCharacter-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # Release APK 업로드
      - name: Upload Release APK
        if: github.event.inputs.build_type == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: NovelCharacter-release
          path: app/build/outputs/apk/release/app-release*.apk
          retention-days: 90

      # 빌드 정보 출력
      - name: Build Summary
        if: always()
        run: |
          echo "## Build Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            SIZE=$(du -h app/build/outputs/apk/debug/app-debug.apk | cut -f1)
            echo "- Debug APK: $SIZE" >> $GITHUB_STEP_SUMMARY
          fi
          if ls app/build/outputs/apk/release/app-release*.apk 1>/dev/null 2>&1; then
            SIZE=$(du -h app/build/outputs/apk/release/app-release*.apk | cut -f1)
            echo "- Release APK: $SIZE" >> $GITHUB_STEP_SUMMARY
          fi
